name: Build installers

# Normally started by scripts/Release.sh: a v* tag builds the Windows installer here and publishes
# the Release; the Mac .dmg is built on the maintainer's Mac and uploaded by that script (GitHub's
# Mac runners often wait a long time). The Mac job below only runs when started by hand
# (Actions tab -> Run workflow). File names must not change: the in-app updater relies on them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Mac (Apple Silicon + Intel) -> Klar-Mac.dmg
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: K-HAVE-U
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/rune
          path: rune
          token: ${{ secrets.RUNE_TOKEN || github.token }}
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: K-HAVE-U
        shell: bash
        run: |
          V="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $V"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            K-HAVE-U
          # Keep compiled rune (a path dependency) in the cache too: it is the slowest part.
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Build universal .app and .dmg
        working-directory: K-HAVE-U
        env:
          UNIVERSAL: "1"
        run: bash packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: K-HAVE-U/dist/Klar-Mac.dmg

  windows:
    name: Windows (x64) -> Klar-Windows-Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: K-HAVE-U
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/rune
          path: rune
          token: ${{ secrets.RUNE_TOKEN || github.token }}
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: K-HAVE-U
        shell: bash
        run: |
          V="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $V"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            K-HAVE-U
          # Keep compiled rune (a path dependency) in the cache too: it is the slowest part.
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Build
        working-directory: K-HAVE-U
        run: cargo build --release
      - name: Build Setup.exe
        working-directory: K-HAVE-U
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: K-HAVE-U/dist/Klar-Windows-Setup.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/Klar-Windows-Setup.exe
