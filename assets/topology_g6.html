              enable: (e) => e.targetType === 'node' || e.targetType === 'edge',
              getContent: renderTooltipContent,
            },
          ],
        });

        graph.on('node:click', (evt) => {
          const id = evt && evt.target && evt.target.id;
          if (!id) return;
          const nodeData = graph.getNodeData(id);
          const svcName = nodeData && nodeData.data && nodeData.data.serviceName;
          if (svcName) {
            currentSelectedService = svcName;
            if (!searchQuery.trim()) {
              applySelectionAndSearch(false);
            }
            postIpc({ type: 'select_service', name: svcName });
          }
        });

        graph.on('node:dblclick', (evt) => {
          const id = evt && evt.target && evt.target.id;
          if (!id) return;
          const nodeData = graph.getNodeData(id);
          const svcName = nodeData && nodeData.data && nodeData.data.serviceName;
          if (svcName) {
            postIpc({ type: 'drill_service', name: svcName });
          }
        });

        graph.on('canvas:click', () => {
          if (currentSelectedService) {
            currentSelectedService = null;
            applySelectionAndSearch(false);
            postIpc({ type: 'clear_selection' });
          }
        });

        // Keep dragged edges cleanly orthogonal mid-drag and re-compute non-overlapping lanes on drop
        graph.on('node:dragstart', (evt) => {
          if (edgeMode !== 'polyline' || !graph) return;
          const draggedId = evt && evt.target && evt.target.id;
          if (!draggedId) return;
          try {
            const curEdges = graph.getEdgeData() || [];
            const affected = curEdges.filter((e) => e.source === draggedId || e.target === draggedId);
            if (affected.length) {
              graph.updateEdgeData(affected.map((e) => ({
                id: e.id,
                style: Object.assign({}, e.style, {
                  controlPoints: [],
                  router: { type: 'orth', padding: 12 },
                }),
              })));
            }
          } catch (_) {}
        });

        graph.on('node:dragend', () => {
          if (edgeMode === 'polyline') {
            rerouteLivePolylines(buildSeq);
          }
        });

        graph.on('viewport:transform', updateZoomReadout);
        let needsPostLayoutFit = shouldFit;
        let isRendering = true;
        let layoutSettled = false;

        graph.on('afterlayout', () => {
          layoutSettled = true;
          if (isRendering || buildSeq !== graphBuildSeq || !graph) return;
          const afterReroute = edgeMode === 'polyline'
            ? rerouteLivePolylines(buildSeq)
            : Promise.resolve();
          afterReroute.then(() => {
            if (needsPostLayoutFit && buildSeq === graphBuildSeq && graph) {
              needsPostLayoutFit = false;
              graph.fitView({ padding: [74, 48, 74, 48] }).then(updateZoomReadout).catch(() => {});
            }
          });
        });
        graph.on('afterrender', () => {
          updateZoomReadout();
          applySelectionAndSearch(false);
        });

        await graph.render();
        isRendering = false;
        if (buildSeq !== graphBuildSeq || !graph) return;

        if (edgeMode === 'polyline' && layoutMode !== 'zones' && layoutSettled) {
          await rerouteLivePolylines(buildSeq);
          if (buildSeq !== graphBuildSeq || !graph) return;
        }

        if (shouldFit && (layoutMode === 'zones' || layoutSettled)) {
          needsPostLayoutFit = false;
          try { await graph.fitView({ padding: [74, 48, 74, 48] }); } catch (_) {}
        }
        updateZoomReadout();
        statusOverlay.classList.add('hidden');
      }

      function updateMetaHud(payload) {
        const m = (payload && payload.meta) || {};
        metaNs.textContent = `${m.envLabel || 'STG'} / ${m.namespace || 'cluster'}`;
        metaCounts.textContent = `• ${m.serviceCount || 0} services • ${m.ingressCount || 0} routes • ${m.edgeCount || 0} edges`;
      }

      function clearSearch(refit) {
        clearTimeout(searchDebounce);
        focusSeq++;
        searchQuery = '';
        filterInput.value = '';
        applySelectionAndSearch(false);
        if (refit && graph) {
          graph.fitView({ padding: [74, 48, 74, 48] }).then(updateZoomReadout).catch(() => {});
        }
      }

      // Public bridge invoked from Rust via wry::WebView::evaluate_script
      window.__k9sTopology = {
        setData(payload) {
          currentPayload = payload;
          currentSelectedService = payload && payload.selectedService ? payload.selectedService : null;
          updateMetaHud(payload);
          if (g6Loaded) {
            rebuildGraph(true);
          }
        },
        setSelected(serviceName) {
          currentSelectedService = serviceName || null;
          applySelectionAndSearch(false);
        },
        fitView() {
          if (graph) {
            graph.fitView({ padding: [74, 48, 74, 48] }).then(updateZoomReadout).catch(() => {});
          }
        },
        zoomBy(ratio) {
          if (graph) {
            graph.zoomBy(ratio).then(updateZoomReadout).catch(() => {});
          }
        },
        resetView() {
          currentSelectedService = null;
          clearSearch(true);
          postIpc({ type: 'clear_selection' });
        }
      };

      // Bottom floating toolbar bindings
      document.getElementById('btn-zoom-in').addEventListener('click', () => window.__k9sTopology.zoomBy(1.2));
      document.getElementById('btn-zoom-out').addEventListener('click', () => window.__k9sTopology.zoomBy(1 / 1.2));
      document.getElementById('btn-fit').addEventListener('click', () => window.__k9sTopology.fitView());
      document.getElementById('btn-reset').addEventListener('click', () => window.__k9sTopology.resetView());

      const btnCurve = document.getElementById('btn-edge-curve');
      const btnPoly = document.getElementById('btn-edge-poly');
      btnCurve.addEventListener('click', () => {
        if (edgeMode === 'quadratic') return;
        edgeMode = 'quadratic';
        btnCurve.classList.add('active');
        btnPoly.classList.remove('active');
        rebuildGraph(false);
      });
      btnPoly.addEventListener('click', () => {
        if (edgeMode === 'polyline') return;
        edgeMode = 'polyline';
        btnPoly.classList.add('active');
        btnCurve.classList.remove('active');
        rebuildGraph(false);
      });

      const layoutBtns = {
        network: document.getElementById('btn-layout-network'),
        zones: document.getElementById('btn-layout-zones'),
        dagre: document.getElementById('btn-layout-dagre'),
      };
      function setLayoutMode(nextMode) {
        if (layoutMode === nextMode) return;
        layoutMode = nextMode;
        for (const [k, btn] of Object.entries(layoutBtns)) {
          btn.classList.toggle('active', k === nextMode);
        }
        rebuildGraph(true);
      }
      layoutBtns.network.addEventListener('click', () => setLayoutMode('network'));
      layoutBtns.zones.addEventListener('click', () => setLayoutMode('zones'));
      layoutBtns.dagre.addEventListener('click', () => setLayoutMode('dagre'));

      // Search input: debounced spotlight + camera focus; Enter cycles matches; clear restores view
      filterInput.addEventListener('input', (e) => {
        searchQuery = e.target.value || '';
        clearTimeout(searchDebounce);
        if (!searchQuery.trim()) {
          applySelectionAndSearch(false);
          if (graph) {
            graph.fitView({ padding: [74, 48, 74, 48] }).then(updateZoomReadout).catch(() => {});
          }
          return;
        }
        searchDebounce = setTimeout(() => {
          applySelectionAndSearch(true);
        }, 120);
      });

      filterInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          clearTimeout(searchDebounce);
          const trimmed = (filterInput.value || '').trim();
          if (trimmed !== searchQuery.trim() || lastMatchIds.length === 0) {
            searchQuery = filterInput.value || '';
            await applySelectionAndSearch(false);
          }
          if (lastMatchIds.length > 0) {
            const targetId = lastMatchIds[matchCursor % lastMatchIds.length];
            matchCursor = (matchCursor + 1) % lastMatchIds.length;
            focusMatchedNodes([targetId]);
          }
        }
      });

      searchClearBtn.addEventListener('click', () => {
        clearSearch(true);
        filterInput.focus();
      });

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          filterInput.focus();
          filterInput.select();
          return;
        }
        if (e.key === 'Escape') {
          if (searchQuery.trim()) {
            clearSearch(true);
            return;
          }
          postIpc({ type: 'exit_fullscreen' });
        }
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        if (!graph) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const container = document.getElementById('mount');
          const w = Math.max(container.clientWidth || window.innerWidth, 100);
          const h = Math.max(container.clientHeight || window.innerHeight, 100);
          try {
            graph.resize(w, h);
          } catch (_) {}
        }, 40);
      });

      function loadScript(index) {
        if (index >= CDN_URLS.length) {
          statusTitle.textContent = 'AntV G6 v5 could not load (Offline / CDN blocked)';
          statusBody.textContent = 'Check your network connection or switch to the Classic Isometric view in the toolbar above.';
          postIpc({ type: 'load_error', message: 'Failed to load @antv/g6@5 from CDN' });
          return;
        }
        const script = document.createElement('script');
        script.src = CDN_URLS[index];
        script.async = true;
        script.onload = () => {
          if (window.G6 && window.G6.Graph) {
            g6Loaded = true;
            registerK8sCardNode();
            postIpc({ type: 'ready' });
            if (currentPayload) {
              rebuildGraph(true);
            } else {
              statusTitle.textContent = 'Waiting for cluster snapshot…';
              statusBody.textContent = 'AntV G6 v5 engine ready.';
            }
          } else {
            loadScript(index + 1);
          }
        };
        script.onerror = () => loadScript(index + 1);
        document.head.appendChild(script);
      }

      loadScript(0);
    })();
  </script>
</body>
</html>
